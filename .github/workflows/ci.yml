name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore CQPulse.slnx
      - run: dotnet build CQPulse.slnx --no-restore --configuration Release
      - run: dotnet test CQPulse.slnx --no-build --configuration Release
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/CQPulse.Client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/CQPulse.Client/package-lock.json
      - run: npm ci
      - run: npm run build
